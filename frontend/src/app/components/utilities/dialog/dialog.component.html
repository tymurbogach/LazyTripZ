<div class="pt-4 flex flex-col items-center text-center gap-4">
    <div class="w-16 h-16 rounded-full overflow-hidden">
        <img [src]="data.icon" alt="Icono mensaje" />
    </div>
    
    <p mat-dialog-content class="px-4 text-lg text-gray-700 font-semibold">{{ data.message }}</p>

    @if (data.setPassword) {
        <input 
            type="password" 
            name="password" 
            placeholder="Contraseña"
            [(ngModel)]="password" 
            class="w-5/6 px-4 py-2 inset-shadow-sm inset-shadow-neutral-400 rounded bg-white/65 focus:outline-none transition-colors" 
        />
    }
  
    <div mat-dialog-actions class="flex w-full">
        @if (data.setPassword) {
            <button
                mat-button
                (click)="onCancel()"
                class="w-full px-6 py-2 font-semibold bg-gray-300/50 hover:bg-gray-300/80 active:bg-gray-400 text-gray-700 active:text-white 
                        transition-colors cursor-pointer"
            >
                M&aacute;s tarde
            </button>
        
            <button
                mat-button
                color="primary"
                (click)="onConfirm()"
                [disabled]="!password"
                class="w-full px-6 py-2 font-semibold bg-emerald-600/55 hover:bg-emerald-700/80 active:bg-emerald-800 text-white transition-colors 
                        cursor-pointer"
            >
                Aplicar
            </button>

        } @else {
        @if (data.confirm) {
            <button
                mat-button
                (click)="onCancel()"
                class="w-full px-6 py-2 font-semibold bg-gray-300/50 hover:bg-gray-300/80 active:bg-gray-400 text-gray-700 active:text-white 
                        transition-colors cursor-pointer"
            >
                Cancelar
            </button>
        }
        <button
            mat-button
            color="primary"
            (click)="onConfirm()"
            class="w-full px-6 py-2 font-semibold bg-emerald-600/55 hover:bg-emerald-700/80 active:bg-emerald-800 text-white transition-colors 
                    cursor-pointer"
        >
            Aceptar
        </button>
        }
    </div>
</div>
