<div class="place-search-wrapper">

  <!-- Input de búsqueda -->
  <div class="search-input-row" [class.loading]="isLoading">

    <!-- Icono pin de ubicación -->
    <span class="pin-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    </span>

    <input
      type="text"
      class="search-input"
      [value]="query"
      (input)="onInput($any($event.target).value)"
      placeholder="Busca tu próximo destino..."
      autocomplete="off"
      />

    <!-- Spinner de carga -->
    @if (isLoading) {
      <span class="spinner" aria-label="Buscando...">
        <span></span><span></span><span></span>
      </span>
    }

    <!-- Botón limpiar -->
    @if (query && !isLoading) {
      <button
        type="button"
        (click)="clearSelection()"
        class="clear-btn"
        title="Limpiar"
        >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    }
  </div>

  <!-- Dropdown de resultados -->
  @if (showDropdown) {
    <div class="results-dropdown" role="listbox">
      <div class="results-header">
        <span class="results-label">Resultados</span>
        <span class="results-source">via OpenStreetMap</span>
      </div>
      @for (place of results; track place; let i = $index) {
        <button
          type="button"
          class="result-item"
          role="option"
          (click)="selectPlace(place)"
          >
          <span class="result-dot" [style.animation-delay]="(i * 60) + 'ms'"></span>
          <div class="result-text">
            <span class="result-city">{{ place.city }}</span>
            @if (place.province || place.country) {
              <span class="result-sub">
                {{ place.province ? place.province + ' · ' + place.country : place.country }}
              </span>
            }
          </div>
          <svg class="result-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      }
    </div>
  }

  <!-- Mensaje sin query suficiente -->
  @if (!showDropdown && query.length > 0 && query.length < 3) {
    <p class="hint-text">
      Escribe al menos 3 caracteres
    </p>
  }

</div>
