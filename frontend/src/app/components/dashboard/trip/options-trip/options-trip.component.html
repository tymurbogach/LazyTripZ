<div class="absolute h-max -top-4 right-1 flex flex-col items-center gap-3 p-0 rounded-b-xl w-16 transition-all 
            duration-500 bg-gray-700 hover:bg-gray-800 shadow-lg shadow-gray-600 z-20"
    [ngClass]="expand ? 'max-h-96 opacity-100 pb-6' : 'max-h-max pb-0'">
    
    <!-- Marcador menú tipo bookmark -->
    <button (click)="toogleOptions()"
        class="flex justify-center w-16 h-16 items-center transition-all duration-800 cursor-pointer text-white"
        [ngClass]="expand ? 'rotate-180' : 'rotate-0'">
        <mat-icon class="material-symbols">settings</mat-icon>
    </button>
    
    @if (expand) {
        <div @expandCollapse class="flex flex-col gap-3 px-4 transition-all duration-500">
            <button @fadeInOut 
                    (click)="showUsers()" 
                    class="items-center justify-center w-10 h-10 rounded-full bg-neutral-200 hover:bg-blue-100
                    text-gray-700 hover:text-blue-600 shadow-md transition duration-200 cursor-pointer" 
                    [ngClass]="expand ? 'flex' : 'hidden'"
                    title="Ver usuarios">
                <mat-icon class="material-symbols">manage_accounts</mat-icon>
            </button>
            <button @fadeInOut 
                    (click)="editTrip()" 
                    [disabled]="!permission"
                    class="items-center justify-center w-10 h-10 rounded-full bg-neutral-200 
                    text-gray-700 shadow-md transition duration-200"
                    [ngClass]="{
                        'opacity-50 cursor-not-allowed' : !permission,
                        'hover:text-green-600 hover:bg-green-100 cursor-pointer' : permission,
                        'flex' :expand,
                        'hidden' : !expand
                    }"
                    title="Editar viaje">
                <mat-icon class="material-symbols-outlined">edit_document</mat-icon>
            </button>
            <button @fadeInOut 
                    (click)="deleteTrip()" 
                    [disabled]="!permission"
                    class="items-center justify-center w-10 h-10 rounded-full bg-red-500/80
                    text-white shadow-md transition duration-200" 
                    [ngClass]="{
                        'opacity-50 cursor-not-allowed' : !permission,
                        'hover:bg-red-600 cursor-pointer' : permission,
                        'flex' :expand,
                        'hidden' : !expand
                    }"
                    title="Eliminar viaje">
                <mat-icon class="material-symbols">close</mat-icon>
            </button>
        </div>
    }
</div>
