server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and auth to Laravel backend (internal Docker network)
    location /api/ {
        proxy_pass http://lazytripz-backend:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/google {
        proxy_pass http://lazytripz-backend:80/auth/google;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/google/callback {
        proxy_pass http://lazytripz-backend:80/auth/google/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Avatares e imágenes del diario. Sin esto caen en el try_files de abajo y
    # devuelven el index.html de la SPA con un 200, así que el navegador recibe
    # HTML donde espera una imagen y la muestra rota.
    location /storage/ {
        proxy_pass http://lazytripz-backend:80/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
